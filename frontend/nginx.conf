server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Privacy-preserving reverse proxy note: disable access logging on anonymous feedback path
    location = /api/public/feedback {
        access_log off;
        proxy_pass http://backend:8080/api/public/feedback;
        proxy_set_header Host $host;
        proxy_set_header Content-Type $content_type;
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
