server:
  port: ${PORT:${SERVER_PORT:8080}}
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: college-quiz-feedback-portal
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/college_quiz_portal?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  security:
    jwt-secret: ${JWT_SECRET:}
    jwt-expiration-ms: ${JWT_EXPIRATION_MS:28800000}
    token-pepper: ${TOKEN_PEPPER:}
    cookie-secure: ${COOKIE_SECURE:false}
    cookie-same-site: ${COOKIE_SAME_SITE:Lax}
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}
  portal:
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:5173}
    rate-limit-per-minute: ${RATE_LIMIT_PER_MINUTE:60}
  seed:
    enabled: ${SEED_ENABLED:true}
    admin-email: ${SEED_ADMIN_EMAIL:admin@college.edu}
    admin-password: ${SEED_ADMIN_PASSWORD:}
    staff-email: ${SEED_STAFF_EMAIL:staff@college.edu}
    staff-password: ${SEED_STAFF_PASSWORD:}

logging:
  level:
    com.college.quizportal: INFO
    org.springframework.security: WARN
