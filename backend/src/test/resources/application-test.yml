spring:
  datasource:
    url: jdbc:h2:mem:quizportal_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  security:
    jwt-secret: test-only-ephemeral-signing-key-at-least-64-characters-long-for-hs256-tests
    token-pepper: test-only-ephemeral-pepper-value-for-hashing-tokens
    cookie-secure: false
  portal:
    rate-limit-per-minute: 500
  seed:
    enabled: true
    admin-email: admin@college.edu
    admin-password: TestAdmin!2026
    staff-email: staff@college.edu
    staff-password: TestStaff!2026
